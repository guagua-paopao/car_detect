{
  "schema_version": "1.0",
  "config_version": "vehicle-analytics-m4",
  "labels_version": "vehicle-labels-v1",
  "labels_path": "./config/vehicle_labels.v1.json",
  "model_registry_path": "./models/manifests/model_registry.v1.json",
  "models": {
    "vehicle_detector": {
      "artifact": "vehicle-det-v1",
      "role": "detection",
      "delivery_status": "deployed",
      "backend": "tensorrt",
      "precision": "fp16",
      "onnx_path": "./models/vehicle-det-v1.onnx",
      "engine_path": "./engines/vehicle-det-v1.engine",
      "input_size": 960,
      "max_batch": 1,
      "workers": 2
    },
    "vehicle_attribute": {
      "artifact": "vehicle-attr-best-components-256-r1",
      "role": "attributes",
      "delivery_status": "deployed",
      "backend": "tensorrt",
      "precision": "fp16",
      "onnx_path": "./models/candidates/vehicle-attr-best-components-256-r1/vehicle-attr-best-components-256-r1.onnx",
      "engine_path": "./models/candidates/vehicle-attr-best-components-256-r1/vehicle-attr-best-components-256-r1.engine",
      "input_size": 256,
      "workers": 1,
      "max_batch": 16
    }
  },
  "vehicle_analytics": {
    "detection_fps": 8,
    "detection_confidence_threshold": 0.4,
    "min_confirm_hits": 3,
    "tracking_iou_threshold": 0.3,
    "min_crop_width_px": 96,
    "min_crop_height_px": 64,
    "min_crop_sharpness": 0.02,
    "min_crop_exposure": 0.08,
    "max_crop_exposure": 0.95,
    "max_crop_occlusion": 0.5,
    "reject_truncated_crops": true,
    "attribute_vote_samples": 3,
    "attribute_max_observations": 5,
    "type_threshold": 0.01,
    "color_threshold": 0.01,
    "track_timeout_ms": 1500,
    "publish_unknown_on_exit": true,
    "body_types": [
      "sedan",
      "suv",
      "mpv",
      "van",
      "pickup",
      "bus",
      "light_truck",
      "heavy_truck",
      "other",
      "unknown"
    ],
    "colors": [
      "black",
      "white",
      "silver_gray",
      "red",
      "blue",
      "green",
      "yellow_orange",
      "brown_beige",
      "other",
      "unknown"
    ]
  },
  "queues": {
    "detection_pending_per_camera": 1,
    "attribute_max_pending": 128,
    "attribute_pending_per_track": 1
  }
}
